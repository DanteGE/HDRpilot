<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>HDRpilot – Spielebibliothek</title>
<link rel="icon" id="favicon" href="data:,">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;600;700;800&family=Manrope:wght@500;600;700;800&family=JetBrains+Mono:wght@500;600&display=swap" rel="stylesheet">
<link rel="stylesheet" href="app.css">
</head>
<body>
<div id="app" class="app dark v-liste p-bibliothek fx-0">
  <svg width="0" height="0" style="position:absolute" aria-hidden="true" focusable="false"><defs>
    <linearGradient id="lg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--c1)"></stop><stop offset=".55" style="stop-color:var(--c2)"></stop><stop offset="1" style="stop-color:var(--c3)"></stop></linearGradient>
    <!-- „HDR aus“: Verlauf Akzent → Atmosphäre als Linie, je Taskleiste auf ≥ 3:1 gebracht (D = dunkle, L = helle Taskleiste) -->
    <linearGradient id="lgoD" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--icD1)"></stop><stop offset="1" style="stop-color:var(--icD2)"></stop></linearGradient>
    <linearGradient id="lgoL" x1="0" y1="0" x2="1" y2="1"><stop offset="0" style="stop-color:var(--icL1)"></stop><stop offset="1" style="stop-color:var(--icL2)"></stop></linearGradient>
    <!-- Programmsymbol: Sonne über dem Horizont. L = ab 24 px, S = 16/20 px (dickere Striche) -->
    <g id="iOnL"><rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#lg)"></rect><path d="M7 16.5a5 5 0 0 1 10 0z" style="fill:var(--on)"></path><path d="M4 16.5h16M12 6v2.4M6.2 9l1.6 1.6M17.8 9l-1.6 1.6" fill="none" style="stroke:var(--on)" stroke-width="2.2" stroke-linecap="round"></path></g>
    <g id="iOffL"><path d="M3.5 16.5h17M7 16.5a5 5 0 0 1 10 0M12 5.5v2.6M6 8.8l1.8 1.8M18 8.8l-1.8 1.8" fill="none" style="stroke:var(--offg,url(#lgoD))" stroke-width="2.4" stroke-linecap="round"></path></g>
    <g id="iOnS"><rect x=".5" y=".5" width="23" height="23" rx="6" fill="url(#lg)"></rect><path d="M6.5 17a5.5 5.5 0 0 1 11 0z" style="fill:var(--on)"></path><path d="M3.5 17h17M12 5v3.5" fill="none" style="stroke:var(--on)" stroke-width="2.8" stroke-linecap="round"></path></g>
    <g id="iOffS"><path d="M2.5 17.5h19M6 17.5a6 6 0 0 1 12 0M12 4.5v3.6" fill="none" style="stroke:var(--offg,url(#lgoD))" stroke-width="3" stroke-linecap="round"></path></g>
    <g id="iPauseL"><path d="M3.5 16.5h17M7 16.5a5 5 0 0 1 10 0M12 6v2.4M6.2 9l1.6 1.6M17.8 9l-1.6 1.6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" opacity=".7"></path><rect x="15.5" y="15.5" width="8" height="8" rx="2.4" fill="#FFB020" style="stroke:var(--tbg,#1c1d24)" stroke-width="1.2"></rect><path d="M18.4 17.6v3.8M20.6 17.6v3.8" stroke="#1A1206" stroke-width="1.3" stroke-linecap="round"></path></g>
    <g id="iPauseS"><path d="M3 17h18M6.5 17a5.5 5.5 0 0 1 11 0M12 5v3.5" fill="none" stroke="currentColor" stroke-width="2.8" stroke-linecap="round" opacity=".7"></path><rect x="14.5" y="14.5" width="9.5" height="9.5" rx="2.6" fill="#FFB020" style="stroke:var(--tbg,#1c1d24)" stroke-width="1.2"></rect><path d="M18 17v4M20.6 17v4" stroke="#1A1206" stroke-width="1.6" stroke-linecap="round"></path></g>
    <g id="iRunL"><rect x="1" y="1" width="22" height="22" rx="6.5" fill="url(#lg)"></rect><path d="M7 16.5a5 5 0 0 1 10 0z" style="fill:var(--on)"></path><path d="M4 16.5h16M12 6v2.4M6.2 9l1.6 1.6M17.8 9l-1.6 1.6" fill="none" style="stroke:var(--on)" stroke-width="2.2" stroke-linecap="round"></path><circle cx="19.5" cy="19.5" r="4.3" fill="#2BD67B" style="stroke:var(--tbg,#1c1d24)" stroke-width="1.2"></circle><path d="M18.4 17.6l3 1.9-3 1.9z" fill="#06210F"></path></g>
    <g id="iRunS"><rect x=".5" y=".5" width="23" height="23" rx="6" fill="url(#lg)"></rect><path d="M6.5 17a5.5 5.5 0 0 1 11 0z" style="fill:var(--on)"></path><path d="M3.5 17h17M12 5v3.5" fill="none" style="stroke:var(--on)" stroke-width="2.8" stroke-linecap="round"></path><circle cx="19" cy="19" r="5" fill="#2BD67B" style="stroke:var(--tbg,#1c1d24)" stroke-width="1.2"></circle></g>
  </defs></svg>

  <div class="ambient" aria-hidden="true">
    <div class="amb-l" id="ambA"></div><div class="amb-l" id="ambB"></div>
    <div class="amb-g"></div><div class="aur x1"></div><div class="aur x2"></div><div class="amb-v"></div>
  </div>

  <header class="titlebar">
    <svg class="wico" id="wico" viewBox="0 0 24 24" aria-hidden="true"><use href="#iOffS"></use></svg>
    <span class="wt" id="wtitle">HDRpilot – Spielebibliothek</span>
    <span class="sp"></span>
    <button class="cap" aria-label="Minimieren" data-act="min"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M0 5.5h10"></path></svg></button>
    <button class="cap" aria-label="Maximieren"><svg viewBox="0 0 10 10" aria-hidden="true"><rect x=".5" y=".5" width="9" height="9" rx="1.5"></rect></svg></button>
    <button class="cap x" aria-label="Schließen" data-act="min"><svg viewBox="0 0 10 10" aria-hidden="true"><path d="M.5.5l9 9M9.5.5l-9 9"></path></svg></button>
  </header>

  <main class="page lib" id="lib">
    <section class="hero" id="hero" aria-label="Ausgewähltes Spiel">
      <div class="stage"><div class="kb" id="slots"></div></div>
      <div class="rays" aria-hidden="true"><i style="--x:28%;--w:0s"></i><i style="--x:47%;--w:-4.5s"></i><i style="--x:66%;--w:-9s"></i></div>
      <div class="bk" id="bk" aria-hidden="true"></div>
      <div class="bloom" aria-hidden="true"></div>
      <div class="scrim" aria-hidden="true"></div>
      <div class="flash" id="flash" aria-hidden="true"></div>
      <div class="dimfx" id="dimfx" aria-hidden="true"></div>
      <div class="sweep" id="sweep" aria-hidden="true"><i></i><b></b></div>
      <canvas class="pfx" id="pfx" aria-hidden="true"></canvas>
      <div class="hc" id="hc"></div>
    </section>

    <div class="hbar">
      <div class="brand">
        <div class="lgo"><svg viewBox="0 0 24 24" class="glyph" aria-hidden="true"><path class="lgS" d="M7 17a5 5 0 0 1 10 0z"></path><path d="M4 17h16M7 17a5 5 0 0 1 10 0M12 6.5v2.2M6.4 9.4l1.5 1.5M17.6 9.4l-1.5 1.5"></path></svg></div>
        <div><div class="hdt">Spielebibliothek</div><div class="hds" id="hds"></div></div>
      </div>
      <div class="mon glass" id="mon"></div>
      <button class="pl pz glass" id="pauseBtn" data-act="pause" aria-pressed="false"></button>
      <button class="ib gear glass" data-act="page" data-v="darstellung" aria-label="Einstellungen · Darstellung" title="Einstellungen · Darstellung"></button>
    </div>

    <aside class="acard" id="acard" aria-label="Automatik des gewählten Spiels"></aside>
    <div class="dwb" id="dwb" aria-hidden="true"></div>
    <aside class="pane" id="pane" aria-label="Spieldetails"><div class="psc" id="psc"></div></aside>

    <div class="toolbar" id="toolbar"></div>

    <section class="body">
      <div class="view lst" id="lst" role="region" aria-label="Spieleliste"></div>
      <div class="view shf" id="shf" role="region" aria-label="Regal"></div>
      <div class="view grd" id="grd" role="region" aria-label="Raster"></div>
    </section>

    <footer class="status" id="status"></footer>
  </main>

  <main class="page look" id="look"></main>

  <div class="ctx" id="ctx" role="menu" hidden></div>
  <div class="dlgw" id="dlgw" hidden></div>
  <div class="toast" id="toast" role="status"></div>
  <div class="wv" id="wv"><i></i></div>
  <div class="edge" id="edge"></div>
  <input type="file" id="filepick" accept="image/*,.ico" hidden>
</div>
<script src="app.js"></script>
</body>
</html>
